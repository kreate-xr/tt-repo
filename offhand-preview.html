<!-- TEMPORARY dev-only preview of the virtual off-hand on a stand-in controller.
     Not part of the game — safe to delete. Open at /offhand-preview.html -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Off-hand preview</title>
<style>
  body { background:#3a3f4a; margin:12px; font-family:system-ui,sans-serif; color:#ddd; }
  .grid { display:grid; grid-template-columns:repeat(4, 320px); gap:8px; }
  figure { margin:0; } figcaption { font-size:12px; margin-top:2px; }
  img { width:320px; height:320px; display:block; background:#222; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script type="module">
  import * as THREE from 'three';
  import { createOffHand } from '/js/scene/offHand.js';
  import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

  const W = 320;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, W);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x222831);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.2));
  const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(1, 2, 1.5); scene.add(sun);

  // The official Quest 3 controller model (WebXR input-profiles, authored in
  // gripSpace), translucent so fingers inside it show; held ball at
  // playerServe's HOLD_OFFSET_LOCAL.
  const CDN = 'https://cdn.jsdelivr.net/npm/@webxr-input-profiles/assets@1.0/dist/profiles/meta-quest-touch-plus/';
  const loader = new GLTFLoader();
  async function makeController(hand) {
    const g = new THREE.Group();
    const gltf = await loader.loadAsync(CDN + hand + '.glb');
    gltf.scene.traverse(o => { if (o.isMesh) { o.material = new THREE.MeshStandardMaterial({ color: 0x30343a, roughness: 0.6, transparent: true, opacity: 0.55, depthWrite: false }); } });
    g.add(gltf.scene);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.02, 20, 14),
      new THREE.MeshStandardMaterial({ color: 0xff8a2a, roughness: 0.4 }));
    ball.position.set(0, 0, -0.085); g.add(ball);
    g.add(new THREE.AxesHelper(0.06));  // red +X, green +Y, blue +Z
    return g;
  }

  async function makeRig(hand) {
    const grip = new THREE.Group();
    grip.position.set(0, 1, 0);
    grip.add(await makeController(hand));
    scene.add(grip);
    const btn = [{ value: 0 }, { value: 0 }];
    const xr = {
      getOffHandGrip: () => grip,
      getOffHandHandedness: () => hand,
      getOffHandInputSource: () => ({ gamepad: { buttons: btn } }),
    };
    return { grip, btn, offHand: createOffHand({ xr }) };
  }

  const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 10);
  const grid = document.getElementById('grid');
  function shot(label, eye) {
    camera.position.set(eye[0], 1 + eye[1], eye[2]);
    camera.lookAt(0, 1, 0.01);
    renderer.render(scene, camera);
    const fig = document.createElement('figure');
    const img = new Image(); img.src = renderer.domElement.toDataURL('image/png');
    const cap = document.createElement('figcaption'); cap.textContent = label;
    fig.append(img, cap); grid.append(fig);
  }

  const VIEWS = [
    ['back of hand (+X)', [0.32, 0.05, 0.02]],
    ['palm side (-X)', [-0.32, 0.05, 0.02]],
    ['from thumb (-Z)', [0.06, 0.08, -0.33]],
    ['from above (+Y)', [0.02, 0.33, 0.04]],
  ];

  async function run() {
    for (const hand of ['right', 'left']) {
      const r = await makeRig(hand);
      // Wait for both rigs to load.
      for (let i = 0; i < 200 && !(r.offHand._rigs.l && r.offHand._rigs.r); i++) await new Promise(res => setTimeout(res, 50));
      for (const [squeeze, trigger, tag] of [[0, 0, 'open'], [0.5, 0, 'half GRIP'], [1, 1, 'GRIP+trigger']]) {
        r.btn[1].value = squeeze; r.btn[0].value = trigger;
        for (let i = 0; i < 30; i++) r.offHand.update(1 / 60);
        r.grip.updateMatrixWorld(true);
        for (const [label, eye] of VIEWS) {
          // Mirror the camera for the left hand so both read the same way.
          const e = hand === 'left' ? [-eye[0], eye[1], eye[2]] : eye;
          shot(`${hand} ${tag} — ${label.replace(/\+X|-X/, m => hand === 'left' ? (m === '+X' ? '-X' : '+X') : m)}`, e);
        }
      }
      r.offHand.dispose();
      scene.remove(r.grip);
    }
    document.title = 'DONE';
  }
  run().catch(e => { document.title = 'ERR ' + e.message; console.error(e); });
</script>
</body>
</html>
