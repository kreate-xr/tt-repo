<!-- TEMPORARY dev-only preview of the wrist menu canvas.
     Not part of the game — safe to delete. Open at /wristmenu-preview.html -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Wrist menu preview</title>
<style>
  body { background:#3a3f4a; margin:20px; font-family:system-ui,sans-serif; color:#ddd; }
  p { margin:14px 0 4px; font-size:13px; }
  .slot canvas { width:900px; display:block; border:1px dashed #666; }
</style>
</head>
<body>
<p>Table BLUE · competition OFF (default)</p><div class="slot" id="s1"></div>
<p>Table GREEN · competition ON — after simulated clicks on the tableColor + rules buttons</p><div class="slot" id="s2"></div>
<script type="module">
  import { WristMenu } from '/js/scene/wristMenu.js';
  import { setTableColor, setBallColor } from '/js/scene/models.js';

  // Hide the WebGL canvas sceneSetup.js appends on import.
  for (const c of document.querySelectorAll('body > canvas')) c.style.display = 'none';

  function snap(slotId, setup) {
    const wm = new WristMenu({ showTune: false });
    if (setup) setup(wm);
    wm.showProgress = 1;
    wm.draw();
    document.getElementById(slotId).appendChild(wm.canvas);
    return wm;
  }

  snap('s1');

  snap('s2', (wm) => {
    wm.on('tableColor', ({ colorId }) => setTableColor(colorId, { persist: false }));
    // Simulate the user pressing the trophy then the table swatch.
    wm.activate(wm.buttons.find(b => b.id === 'rules'));
    wm.activate(wm.buttons.find(b => b.id === 'tableColor'));
  });
</script>
</body>
</html>
